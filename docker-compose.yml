# Whole system:          docker compose up --build      then open http://localhost:8080
# Database only (dev):   docker compose up -d db        API and web then run on the host
#                                                       (dotnet run / npm run dev) against 127.0.0.1:1433
#
# Ports are published on 127.0.0.1 only and differ from the dev servers
# (API 5080, web 3000), so the containers and a local dev setup can run side by side.
#
# ---------------------------------------------------------------------------
# About the sa password: it is committed on purpose and is NOT a secret.
#
# This repository is a job-application test project, not a production system.
# The password only protects a throwaway SQL Server container that runs on the
# reviewer's own machine, listens on 127.0.0.1 only and holds no real data.
# Keeping a working default here lets the project run right after `git clone`
# with no setup. The same value is in
# backend/src/QueueSystem.Api/appsettings.Development.json.
#
# In a real deployment the password would come from a secret store or the
# environment, never from the repository, and the API would not log in as sa.
# To use another password locally, see .env.example.
# ---------------------------------------------------------------------------
name: queue-ticket-system

services:
  db:
    # Pinned to a cumulative update so every machine runs the same build.
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer # free edition for development and testing, not for production
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd!} # dev-only default, see the note above
    ports:
      # Reachable from this machine only. IPv4 only, so clients must use 127.0.0.1
      # rather than localhost (which resolves to ::1 first on Windows).
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # $$ passes the variable through to the container instead of Compose expanding it.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "db" is the service name on the Compose network. Same dev-only password as above.
      ConnectionStrings__QueueDb: "Server=db,1433;Database=QueueSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd!};TrustServerCertificate=True"
      # Creates the schema on first start, so `docker compose up` needs no extra step.
      Database__MigrateOnStartup: "true"
    ports:
      - "127.0.0.1:8081:8080" # optional: lets you call the API directly (e.g. /health)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl or wget, so bash sends the HTTP request itself.
      # Healthy means migrations have run and the API is accepting requests.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build: ./frontend
    environment:
      # Server-side only: the browser talks to the web container, never to the API.
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      api:
        condition: service_healthy # so the first page load never meets an API that is still starting

volumes:
  mssql-data:
